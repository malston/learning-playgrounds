// Total window for demo purposes: 8000 tokens
// Danger zone: 15% – 80% of window (tokens 1200–6400)
const WINDOW_SIZE = 8000;
const DANGER_START = 0.15;
const DANGER_END = 0.80;

function UCurveChart({ highlighted }) {
  const points = [
    { x: 0, y: 20, label: "Start" },
    { x: 16.7, y: 35 },
    { x: 33.3, y: 72 },
    { x: 50, y: 88, label: "Middle" },
    { x: 66.7, y: 72 },
    { x: 83.3, y: 35 },
    { x: 100, y: 20, label: "End" },
  ];

  const toSVG = (x, y) => ({ cx: (x / 100) * 340 + 30, cy: (y / 100) * 120 + 10 });

  const pathD = points
    .map((p, i) => {
      const { cx, cy } = toSVG(p.x, p.y);
      return i === 0 ? `M ${cx} ${cy}` : `L ${cx} ${cy}`;
    })
    .join(" ");

  return (
    <div className="relative">
      <div className="text-xs font-mono text-center mb-1" style={{ color: "#6b7280" }}>
        ← likelihood of being "lost" →
      </div>
      <svg width="400" height="160" viewBox="0 0 400 160" className="w-full">
        <defs>
          <linearGradient id="dangerGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#ef4444" stopOpacity="0.3" />
            <stop offset="100%" stopColor="#ef4444" stopOpacity="0" />
          </linearGradient>
        </defs>

        {/* Grid lines */}
        {[0, 25, 50, 75, 100].map((pct) => (
          <line
            key={pct}
            x1={(pct / 100) * 340 + 30}
            y1="10"
            x2={(pct / 100) * 340 + 30}
            y2="130"
            stroke="#1f2937"
            strokeWidth="1"
            strokeDasharray="3,3"
          />
        ))}

        {/* Filled area */}
        <path
          d={`${pathD} L ${toSVG(100, 100).cx} ${toSVG(100, 100).cy} L ${toSVG(0, 100).cx} ${toSVG(0, 100).cy} Z`}
          fill="url(#dangerGrad)"
        />

        {/* Curve */}
        <path d={pathD} fill="none" stroke="#ef4444" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />

        {/* Highlight zones */}
        {highlighted === "start" && (
          <rect x="30" y="10" width="68" height="120" fill="#22c55e" fillOpacity="0.15" rx="3" />
        )}
        {highlighted === "end" && (
          <rect x="302" y="10" width="68" height="120" fill="#22c55e" fillOpacity="0.15" rx="3" />
        )}
        {highlighted === "middle" && (
          <rect x="130" y="10" width="140" height="120" fill="#ef4444" fillOpacity="0.15" rx="3" />
        )}

        {/* Labels */}
        <text x="30" y="150" fontSize="10" fill="#6b7280" fontFamily="monospace">START</text>
        <text x="170" y="150" fontSize="10" fill="#6b7280" fontFamily="monospace" textAnchor="middle">MIDDLE</text>
        <text x="370" y="150" fontSize="10" fill="#6b7280" fontFamily="monospace" textAnchor="end">END</text>

        {/* Safe zone labels */}
        <text x="64" y="22" fontSize="9" fill="#22c55e" fontFamily="monospace" textAnchor="middle">SAFE</text>
        <text x="336" y="22" fontSize="9" fill="#22c55e" fontFamily="monospace" textAnchor="middle">SAFE</text>
        <text x="200" y="22" fontSize="9" fill="#ef4444" fontFamily="monospace" textAnchor="middle">DANGER ZONE</text>
      </svg>
    </div>
  );
}

function TokenBar({ messages, currentStep }) {
  const totalUsed = messages.slice(0, currentStep + 1).reduce((sum, m) => sum + m.tokens, 0);
  const usedPct = totalUsed / WINDOW_SIZE;

  // Build segments
  let cursor = 0;
  const segments = messages.slice(0, currentStep + 1).map((m, i) => {
    const startPct = cursor / WINDOW_SIZE;
    const widthPct = m.tokens / WINDOW_SIZE;
    const midPct = startPct + widthPct / 2;
    let zone;
    if (midPct < DANGER_START) zone = "safe-start";
    else if (midPct > DANGER_END) zone = "safe-end";
    else zone = "danger";
    cursor += m.tokens;
    return { ...m, startPct, widthPct, zone, index: i };
  });

  const getSegColor = (zone, isLast) => {
    if (zone === "safe-start") return isLast ? "#22c55e" : "#166534";
    if (zone === "safe-end") return isLast ? "#3b82f6" : "#1e3a5f";
    return isLast ? "#ef4444" : "#7f1d1d";
  };

  return (
    <div className="mb-5 p-4 rounded" style={{ background: "#0f172a", border: "1px solid #1e293b" }}>
      <div className="flex justify-between items-center mb-2">
        <div className="text-xs font-mono" style={{ color: "#475569" }}>CONTEXT WINDOW — TOKEN VIEW</div>
        <div className="text-xs font-mono" style={{ color: totalUsed / WINDOW_SIZE > DANGER_START ? "#ef4444" : "#22c55e" }}>
          {totalUsed.toLocaleString()} / {WINDOW_SIZE.toLocaleString()} tokens ({Math.round(usedPct * 100)}%)
        </div>
      </div>

      {/* Bar */}
      <div className="relative h-8 rounded overflow-hidden" style={{ background: "#111827" }}>
        {/* Danger zone overlay */}
        <div
          className="absolute top-0 h-full"
          style={{
            left: `${DANGER_START * 100}%`,
            width: `${(DANGER_END - DANGER_START) * 100}%`,
            background: "rgba(239,68,68,0.06)",
            borderLeft: "1px dashed #7f1d1d",
            borderRight: "1px dashed #7f1d1d",
          }}
        />

        {/* Token segments */}
        {segments.map((seg, i) => (
          <div
            key={seg.id}
            className="absolute top-0 h-full transition-all"
            style={{
              left: `${seg.startPct * 100}%`,
              width: `${Math.max(seg.widthPct * 100, 0.3)}%`,
              background: getSegColor(seg.zone, i === segments.length - 1),
              borderRight: "1px solid #030712",
              opacity: i === segments.length - 1 ? 1 : 0.6,
            }}
            title={`${seg.label} — ${seg.tokens} tokens`}
          />
        ))}

        {/* Zone labels inside bar */}
        <div className="absolute inset-0 flex items-center pointer-events-none px-1">
          <span className="text-xs font-mono" style={{ color: "#22c55e", opacity: 0.7, fontSize: "9px" }}>SAFE</span>
          <div className="flex-1" />
          <span className="text-xs font-mono" style={{ color: "#ef4444", opacity: 0.5, fontSize: "9px" }}>· · · DANGER ZONE · · ·</span>
          <div className="flex-1" />
          <span className="text-xs font-mono" style={{ color: "#3b82f6", opacity: 0.7, fontSize: "9px" }}>SAFE</span>
        </div>
      </div>

      {/* Legend */}
      <div className="flex gap-4 mt-2">
        <span className="text-xs font-mono" style={{ color: "#166534" }}>▪ safe-start msgs</span>
        <span className="text-xs font-mono" style={{ color: "#7f1d1d" }}>▪ danger zone msgs</span>
        <span className="text-xs font-mono" style={{ color: "#1e3a5f" }}>▪ safe-end msgs</span>
        <span className="ml-auto text-xs font-mono" style={{ color: "#374151" }}>brighter = current msg</span>
      </div>
    </div>
  );
}

function ConversationSimulator() {
  const [step, setStep] = useState(0);
  const currentMsg = MESSAGES[step];

  // Calculate cumulative tokens up to and including current message
  const tokensUpTo = (idx) => MESSAGES.slice(0, idx + 1).reduce((s, m) => s + m.tokens, 0);
  const totalUsed = tokensUpTo(step);
  const usedPct = totalUsed / WINDOW_SIZE;

  // Determine zone of current message's midpoint
  const prevTokens = tokensUpTo(step) - currentMsg.tokens;
  const midToken = prevTokens + currentMsg.tokens / 2;
  const midPct = midToken / WINDOW_SIZE;
  const zone = midPct < DANGER_START ? "safe-start" : midPct > DANGER_END ? "safe-end" : "danger";

  const zoneColor = zone === "safe-start" ? "#22c55e" : zone === "safe-end" ? "#3b82f6" : "#ef4444";
  const zoneLabel = zone === "safe-start" ? "✓ SAFE — start of window" : zone === "safe-end" ? "✓ SAFE — end of window" : "⚠ DANGER ZONE";

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <div className="text-sm font-mono" style={{ color: "#9ca3af" }}>
          Message {step + 1} of {MESSAGES.length}
        </div>
        <div className="flex gap-2">
          <button
            onClick={() => setStep(Math.max(0, step - 1))}
            disabled={step === 0}
            className="px-3 py-1 text-xs font-mono rounded"
            style={{ background: "#1f2937", color: step === 0 ? "#374151" : "#9ca3af", border: "1px solid #374151" }}
          >
            ← prev
          </button>
          <button
            onClick={() => setStep(Math.min(MESSAGES.length - 1, step + 1))}
            disabled={step === MESSAGES.length - 1}
            className="px-3 py-1 text-xs font-mono rounded"
            style={{ background: "#1f2937", color: step === MESSAGES.length - 1 ? "#374151" : "#9ca3af", border: "1px solid #374151" }}
          >
            next →
          </button>
        </div>
      </div>

      <TokenBar messages={MESSAGES} currentStep={step} />

      {/* Current message card */}
      <div className="p-4 rounded mb-3" style={{ background: "#0f172a", border: `1px solid ${zoneColor}` }}>
        <div className="flex flex-wrap gap-2 items-start mb-3">
          <span
            className="text-xs font-mono px-2 py-0.5 rounded"
            style={{ background: currentMsg.role === "user" ? "#1e3a5f" : "#1a2e1a", color: currentMsg.role === "user" ? "#93c5fd" : "#86efac" }}
          >
            {currentMsg.role === "user" ? "YOU" : "CLAUDE"}
          </span>
          <span className="text-xs font-mono px-2 py-0.5 rounded" style={{ background: "#111827", color: "#f59e0b" }}>
            {currentMsg.tokens.toLocaleString()} tokens · {currentMsg.tokenLabel}
          </span>
          <span className="text-xs font-mono px-2 py-0.5 rounded ml-auto" style={{ background: "#111827", color: zoneColor }}>
            {zoneLabel}
          </span>
        </div>

        <div className="text-sm font-mono font-semibold mb-2" style={{ color: "#e2e8f0" }}>
          {currentMsg.label}
        </div>
        <div className="text-sm whitespace-pre-wrap" style={{ color: "#94a3b8", fontFamily: "'IBM Plex Sans', sans-serif", lineHeight: "1.6" }}>
          {currentMsg.content}
        </div>

        {/* Running total */}
        <div className="mt-3 pt-3 flex justify-between items-center" style={{ borderTop: "1px solid #1e293b" }}>
          <span className="text-xs font-mono" style={{ color: "#374151" }}>running total</span>
          <span className="text-xs font-mono" style={{ color: usedPct > DANGER_START ? "#ef4444" : "#22c55e" }}>
            {totalUsed.toLocaleString()} / {WINDOW_SIZE.toLocaleString()} tokens used ({Math.round(usedPct * 100)}%)
          </span>
        </div>
      </div>

      {/* Contextual note */}
      {currentMsg.note && (
        <div className="p-3 rounded mb-3" style={{ background: "#1a0f00", border: "1px solid #92400e" }}>
          <div className="text-xs font-mono mb-1" style={{ color: "#f59e0b" }}>INSTRUCTOR NOTE</div>
          <div className="text-sm" style={{ color: "#fcd34d", fontFamily: "'IBM Plex Sans', sans-serif" }}>
            {currentMsg.note}
          </div>
        </div>
      )}

      {step === MESSAGES.length - 1 && (
        <div className="p-3 rounded" style={{ background: "#1a0a0a", border: "1px solid #7f1d1d" }}>
          <div className="text-xs font-mono mb-1" style={{ color: "#ef4444" }}>POST-MORTEM</div>
          <div className="text-sm" style={{ color: "#fca5a5", fontFamily: "'IBM Plex Sans', sans-serif" }}>
            Both critical constraints (ORM only, no schema changes) were violated. Neither was forgotten due to message count — they were lost because two large pastes pushed them deep into the danger zone by token volume. The constraint in message 5 was only 38 tokens, but it was surrounded by 3,500+ tokens of schema and model dumps.
          </div>
        </div>
      )}
    </div>
  );
}

function TechniqueCard({ technique, isActive, onClick }) {
  const impactColors = { high: "#22c55e", medium: "#f59e0b", low: "#6b7280" };

  return (
    <button
      onClick={onClick}
      className="text-left p-4 rounded w-full transition-all"
      style={{
        background: isActive ? "#0f172a" : "#111827",
        border: `1px solid ${isActive ? "#3b82f6" : "#1f2937"}`,
        cursor: "pointer",
      }}
    >
      <div className="flex items-center gap-2 mb-1">
        <span className="text-lg">{technique.icon}</span>
        <span className="font-mono text-sm font-semibold" style={{ color: isActive ? "#93c5fd" : "#e2e8f0" }}>
          {technique.title}
        </span>
        <span
          className="ml-auto text-xs font-mono px-1.5 py-0.5 rounded"
          style={{ background: "#1f2937", color: impactColors[technique.impact] }}
        >
          {technique.impact} impact
        </span>
      </div>
      <div className="text-xs font-mono" style={{ color: "#6b7280" }}>
        {technique.tagline}
      </div>

      {isActive && (
        <div className="mt-3">
          <div className="text-sm mb-3" style={{ color: "#94a3b8", lineHeight: "1.6" }}>
            {technique.description}
          </div>
          <div className="p-3 rounded text-xs font-mono whitespace-pre-wrap" style={{ background: "#0a0f1a", color: "#22c55e", border: "1px solid #1e293b" }}>
            {technique.example}
          </div>
        </div>
      )}
    </button>
  );
}

function QuizSection() {
  const questions = [
    {
      q: "You mention a critical constraint in message 3 of a 20-message conversation. How confident should you be Claude remembers it at message 18?",
      options: ["Very confident — Claude has good memory", "Somewhat confident", "Not confident — it's in the danger zone", "Doesn't matter, just repeat it at the end"],
      correct: 2,
      explanation: "Message 3 of 20 puts that constraint squarely in the middle of the context window — the highest-risk zone. You should assume it may be lost and repeat it before any step that depends on it.",
    },
    {
      q: "What's the best place to put your most critical project constraints?",
      options: ["Anywhere — Claude reads everything equally", "At the very end of your prompt", "At the very start, before anything else", "Spread throughout for coverage"],
      correct: 2,
      explanation: "The start of context gets privileged attention. Front-loading critical constraints — or using tools like CLAUDE.md that load at session start — puts your most important content in the safe zone.",
    },
    {
      q: "A planning session has grown very long. Claude seems confused about earlier decisions. What's the best move?",
      options: ["Keep going and clarify in chat", "Start a fresh session with a summary", "Repeat everything from scratch", "Just re-read the whole conversation"],
      correct: 1,
      explanation: "Starting fresh gives Claude a clean, uncluttered context window. The key is to bring your persistent artifact (plan.md, decisions.md) into the new session — so you don't lose the work, just the clutter.",
    },
    {
      q: "Which pattern best protects context across long, multi-session projects?",
      options: ["Very detailed chat messages", "Persistent markdown files (plan.md, decisions.md)", "Repeating yourself constantly", "Using shorter conversations"],
      correct: 1,
      explanation: "Persistent files exist outside the context window entirely. They can be re-injected at any point, survive session ends, and aren't vulnerable to the U-curve at all. Chat is ephemeral; files are durable.",
    },
  ];

  const [current, setCurrent] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);

  const q = questions[current];

  const handleSelect = (idx) => {
    if (selected !== null) return;
    setSelected(idx);
    if (idx === q.correct) setScore(score + 1);
  };

  const handleNext = () => {
    if (current < questions.length - 1) {
      setCurrent(current + 1);
      setSelected(null);
    } else {
      setDone(true);
    }
  };

  if (done) {
    const pct = Math.round((score / questions.length) * 100);
    return (
      <div className="text-center p-8">
        <div className="text-5xl mb-4">{pct >= 75 ? "🏆" : pct >= 50 ? "📈" : "🔁"}</div>
        <div className="text-2xl font-mono font-bold mb-2" style={{ color: "#e2e8f0" }}>
          {score} / {questions.length}
        </div>
        <div className="text-sm font-mono mb-6" style={{ color: "#6b7280" }}>
          {pct >= 75 ? "Strong grasp of context window principles." : pct >= 50 ? "Solid start — review the techniques section." : "Revisit the simulator and technique cards, then try again."}
        </div>
        <button
          onClick={() => { setCurrent(0); setSelected(null); setScore(0); setDone(false); }}
          className="px-6 py-2 rounded font-mono text-sm"
          style={{ background: "#1e3a5f", color: "#93c5fd", border: "1px solid #2563eb" }}
        >
          retake quiz
        </button>
      </div>
    );
  }

  return (
    <div>
      <div className="flex justify-between items-center mb-4">
        <div className="text-xs font-mono" style={{ color: "#6b7280" }}>
          Question {current + 1} of {questions.length}
        </div>
        <div className="flex gap-1">
          {questions.map((_, i) => (
            <div
              key={i}
              className="w-2 h-2 rounded-full"
              style={{ background: i < current ? "#22c55e" : i === current ? "#3b82f6" : "#1f2937" }}
            />
          ))}
        </div>
      </div>
      <div className="text-sm mb-4" style={{ color: "#e2e8f0", lineHeight: "1.6" }}>
        {q.q}
      </div>
      <div className="flex flex-col gap-2 mb-4">
        {q.options.map((opt, idx) => {
          let bg = "#111827";
          let border = "#1f2937";
          let color = "#94a3b8";
          if (selected !== null) {
            if (idx === q.correct) { bg = "#0d2618"; border = "#22c55e"; color = "#86efac"; }
            else if (idx === selected && idx !== q.correct) { bg = "#1a0a0a"; border = "#ef4444"; color = "#fca5a5"; }
          }
          return (
            <button
              key={idx}
              onClick={() => handleSelect(idx)}
              className="text-left p-3 rounded text-sm transition-all"
              style={{ background: bg, border: `1px solid ${border}`, color, cursor: selected !== null ? "default" : "pointer" }}
            >
              <span className="font-mono mr-2" style={{ color: "#475569" }}>{String.fromCharCode(65 + idx)}.</span>
              {opt}
            </button>
          );
        })}
      </div>
      {selected !== null && (
        <div className="p-3 rounded mb-4 text-sm" style={{ background: "#0a0f1a", color: "#94a3b8", border: "1px solid #1e293b" }}>
          <strong style={{ color: "#e2e8f0" }}>Why: </strong>{q.explanation}
        </div>
      )}
      {selected !== null && (
        <button
          onClick={handleNext}
          className="w-full py-2 rounded font-mono text-sm"
          style={{ background: "#1e3a5f", color: "#93c5fd", border: "1px solid #2563eb" }}
        >
          {current < questions.length - 1 ? "next question →" : "see results →"}
        </button>
      )}
    </div>
  );
}

          {tab === "concept" && (
            <div>
              <div className="mb-6">

                </p>
                <div className="p-3 rounded text-sm" style={{ background: "#111827", border: "1px solid #1f2937", color: "#64748b", fontFamily: "'IBM Plex Sans', sans-serif" }}>
                  Think of it as a fixed-size desk. You can put papers on it, but once it's full, older papers fall off. Claude only works with what's on the desk.
                </div>
              </div>

              <div className="mb-6">
                <h2 className="text-base font-semibold mb-1" style={{ color: "#e2e8f0", fontFamily: "'IBM Plex Sans', sans-serif" }}>

                </h2>

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
